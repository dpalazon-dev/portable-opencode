name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository validation
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt

      - name: Install validation dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-docs.txt

      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/verify-docs.ps1
